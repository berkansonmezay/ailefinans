# fly.toml app configuration file for Aile Finans API
app = 'ailefinans-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
