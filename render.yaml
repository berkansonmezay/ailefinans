services:
  - type: web
    name: ailefinans-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm --filter @family-app/types build && pnpm --filter api db:generate && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
